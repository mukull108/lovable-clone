spring:
  application:
    name: lovable-clone

  #database config
  datasource:
    url: jdbc:postgresql://localhost:5432/lovabledb
    username:
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:default}

stripe:
  api:
    secret: ${STRIPE_API_SECRET:default}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:default}
client:
  url: http://localhost:8080

